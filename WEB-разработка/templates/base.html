<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мое приложение</title>
</head>
<body>
<nav>
    {% if current_user.is_authenticated %}
        <a href="/logout">{{ current_user.name }}</a>
    {% else %}
        <a href="/register">Зарегистрироваться</a>
        <a href="/login">Войти</a>
    {% endif %}
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
